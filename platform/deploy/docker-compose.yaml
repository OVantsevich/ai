name: ai

x-role: &role
  restart: unless-stopped
  environment:
    - TZ=${TZ}
    - GITLAB_URL=${GITLAB_URL}
    - GITLAB_TOKEN=${GITLAB_TOKEN}
    - GITLAB_MCP_AUTH_TOKEN=${GITLAB_MCP_AUTH_TOKEN}
    - ATLASSIAN_SITE=${ATLASSIAN_SITE}
    - ATLASSIAN_EMAIL=${ATLASSIAN_EMAIL}
    - ATLASSIAN_API_TOKEN=${ATLASSIAN_API_TOKEN}
    - GIT_WORK_NAME=${GIT_WORK_NAME}
    - GIT_WORK_EMAIL=${GIT_WORK_EMAIL}
    - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3
  depends_on:
    postgres:
      condition: service_healthy

services:
  role-coordinator:
    <<: *role
    build: ../../roles/coordinator/runtime
    image: ai-role-coordinator:latest
    container_name: ai-role-coordinator
    volumes:
      - ../../roles/coordinator:/role:ro
      - ../../playbooks:/playbooks:ro
      - ../../data/memory/coordinator:/memory
      - ../../data/workspaces/coordinator:/workspaces
      - ../../data/logs/coordinator:/logs

  role-business-analyst:
    <<: *role
    build: ../../roles/business-analyst/runtime
    image: ai-role-business-analyst:latest
    container_name: ai-role-business-analyst
    volumes:
      - ../../roles/business-analyst:/role:ro
      - ../../data/memory/business-analyst:/memory
      - ../../data/workspaces/business-analyst:/workspaces
      - ../../data/logs/business-analyst:/logs

  role-go-developer:
    <<: *role
    build: ../../roles/go-developer/runtime
    image: ai-role-go-developer:latest
    container_name: ai-role-go-developer
    volumes:
      - ../../roles/go-developer:/role:ro
      - ../../data/memory/go-developer:/memory
      - ../../data/workspaces/go-developer:/workspaces
      - ../../data/logs/go-developer:/logs

  role-qa-engineer:
    <<: *role
    build: ../../roles/qa-engineer/runtime
    image: ai-role-qa-engineer:latest
    container_name: ai-role-qa-engineer
    volumes:
      - ../../roles/qa-engineer:/role:ro
      - ../../data/memory/qa-engineer:/memory
      - ../../data/workspaces/qa-engineer:/workspaces
      - ../../data/logs/qa-engineer:/logs

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - AI_ROLES=coordinator,business-analyst,go-developer,qa-engineer
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: ai-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../metrics/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  gitlab-mcp-ro:
    image: zereight050/gitlab-mcp:latest
    container_name: ai-gitlab-mcp-ro
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - STREAMABLE_HTTP=true
      - STREAMABLE_HTTP_AUTH_TOKEN=${GITLAB_MCP_AUTH_TOKEN}
      - MCP_SERVER_URL=http://gitlab-mcp-ro:3002
      - GITLAB_API_URL=${GITLAB_URL}/api/v4
      - GITLAB_PERSONAL_ACCESS_TOKEN=${GITLAB_TOKEN}
      - GITLAB_PERMISSION_MODE=readonly
      - USE_PIPELINE=true
      - USE_MILESTONE=true
      - USE_GITLAB_WIKI=true

  gitlab-mcp-rw:
    image: zereight050/gitlab-mcp:latest
    container_name: ai-gitlab-mcp-rw
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - STREAMABLE_HTTP=true
      - STREAMABLE_HTTP_AUTH_TOKEN=${GITLAB_MCP_AUTH_TOKEN}
      - MCP_SERVER_URL=http://gitlab-mcp-rw:3002
      - GITLAB_API_URL=${GITLAB_URL}/api/v4
      - GITLAB_PERSONAL_ACCESS_TOKEN=${GITLAB_TOKEN}
      - USE_PIPELINE=true
      - USE_MILESTONE=true
      - USE_GITLAB_WIKI=true

volumes:
  n8n_data:
    external: true
    name: ai_n8n_data
  postgres_data:
  grafana_data:

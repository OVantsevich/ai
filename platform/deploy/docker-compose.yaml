name: ai

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: ai-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../metrics/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  gitlab-mcp-ro:
    image: zereight050/gitlab-mcp:latest
    container_name: ai-gitlab-mcp-ro
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - STREAMABLE_HTTP=true
      - STREAMABLE_HTTP_AUTH_TOKEN=${GITLAB_MCP_AUTH_TOKEN}
      - MCP_SERVER_URL=http://gitlab-mcp-ro:3002
      - GITLAB_API_URL=${GITLAB_URL}/api/v4
      - GITLAB_PERSONAL_ACCESS_TOKEN=${GITLAB_TOKEN}
      - GITLAB_PERMISSION_MODE=readonly
      - USE_PIPELINE=true
      - USE_MILESTONE=true
      - USE_GITLAB_WIKI=true

  gitlab-mcp-rw:
    image: zereight050/gitlab-mcp:latest
    container_name: ai-gitlab-mcp-rw
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - STREAMABLE_HTTP=true
      - STREAMABLE_HTTP_AUTH_TOKEN=${GITLAB_MCP_AUTH_TOKEN}
      - MCP_SERVER_URL=http://gitlab-mcp-rw:3002
      - GITLAB_API_URL=${GITLAB_URL}/api/v4
      - GITLAB_PERSONAL_ACCESS_TOKEN=${GITLAB_TOKEN}
      - USE_PIPELINE=true
      - USE_MILESTONE=true
      - USE_GITLAB_WIKI=true

volumes:
  n8n_data:
    external: true
    name: ai_n8n_data
  postgres_data:
  grafana_data:

apiVersion: 1

datasources:
  - name: ai-postgres
    uid: ai-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: ${POSTGRES_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
